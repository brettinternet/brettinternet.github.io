<div class="relative">
  <footer
    class="container mx-auto flex flex-row items-center justify-center gap-3 py-12 px-8 font-mono font-bold text-sm">
    <nav aria-label="Site" class="flex flex-row items-center gap-3">
      <ul class="flex justify-center gap-4">
        <li>
          <a href="/" class="hover:underline">home</a>
        </li>
        <li>
          <a href="/downloads" class="hover:underline">downloads</a>
        </li>
        <li>
          <a href="/about" class="hover:underline">about</a>
        </li>
      </ul>
      <span class="text-stone-400">•</span>
      <ul class="flex justify-center gap-4">
        <li>
          <a target="_blank" rel="noopener noreferrer" href="https://github.com/brettinternet/brettinternet.github.io"
            class="inline-flex hover:underline" aria-label="View this site's source on GitHub">
            source
          </a>
        </li>
      </ul>
    </nav>
    {{ $build_version := getenv "HUGO_BUILD_VERSION" }}
    {{ if $build_version }}
    <span class="absolute right-0 bottom-0 p-4 flex text-xs text-stone-500 ml-1">
      <a href="https://github.com/brettinternet/brettinternet.github.io/commit/{{ $build_version }}"
        class="hover:underline">
        <span class="font-mono">
          {{ $build_version }}
        </span>
      </a>
    </span>
    {{ end }}
  </footer>
</div>
