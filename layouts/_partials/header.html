{{/* Shell-prompt breadcrumb: "brett ~/hum $ █". The user is whoami (/about), ~ is home. */}}
{{ $path := strings.TrimSuffix ".html" (strings.Trim .RelPermalink "/") }}
<header class="w-full flex justify-center px-4 py-8 font-mono text-lg [font-variant-ligatures:none]">
  <nav aria-label="Breadcrumb">
    <a href="{{ "about" | relURL }}" class="font-bold hover:underline">brett</a>
    <a href="{{ "/" | relURL }}" class="text-stone-500 hover:underline" aria-label="home">~</a>{{ with $path }}<span class="text-stone-500">/</span><span aria-current="page">{{ . }}</span>{{ end }}
    <span class="text-amber-700" aria-hidden="true">$</span>
    <span class="prompt-cursor" aria-hidden="true"></span>
  </nav>
</header>
