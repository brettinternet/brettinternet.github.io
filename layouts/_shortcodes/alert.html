<div class="mx-auto w-full md:max-w-4xl px-3" role="alert">
  <div class="border border-stone-800 rounded-sm px-4 py-3 bg-card">
    <div class="flex flex-row space-x-3 items-start">
      <div class="mt-1">
        {{ partial "icons/info.svg" }}
      </div>
      <div class="flex-1">
        <p class="font-bold font-serif text-lg">{{ .Get "title" }}</p>
        <p class="text-sm font-sans">{{ .Get "body" }}</p>
      </div>
      <div class="flex items-center space-x-4">
        <a
          href='{{ .Get "href" }}'
          class="no-underline inline-flex items-center h-8 px-4 m-2 text-sm text-paper font-mono transition-colors duration-150 bg-stone-800 rounded-sm hover:bg-amber-700"
        >
          {{ .Get "action_text" }}
        </a>
        <!-- <button id='close-{{ .Get "key" }}'>
          {{ partial "icons/x.svg" }}
        </button> -->
      </div>
    </div>
  </div>
</div>
